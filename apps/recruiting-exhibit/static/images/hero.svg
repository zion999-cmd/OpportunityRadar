<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1b3f"/>
      <stop offset="0.55" stop-color="#16336b"/>
      <stop offset="1" stop-color="#0a1530"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3d74d8" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#0c1e47" stop-opacity="0.15"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.72" cy="0.3" r="0.55">
      <stop offset="0" stop-color="#7fb0ff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#7fb0ff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="600" fill="url(#sky)"/>
  <rect width="1200" height="600" fill="url(#glow)"/>
  <!-- glass tower, right -->
  <polygon points="640,600 640,120 980,30 980,600" fill="url(#glass)"/>
  <polygon points="980,600 980,30 1180,90 1180,600" fill="#0e2450" opacity="0.55"/>
  <!-- tower grid -->
  <g stroke="#9fc0ff" stroke-opacity="0.28" stroke-width="2">
    <line x1="680" y1="160" x2="680" y2="600"/><line x1="730" y1="150" x2="730" y2="600"/>
    <line x1="780" y1="140" x2="780" y2="600"/><line x1="830" y1="130" x2="830" y2="600"/>
    <line x1="880" y1="120" x2="880" y2="600"/><line x1="930" y1="110" x2="930" y2="600"/>
    <line x1="1020" y1="100" x2="1020" y2="600"/><line x1="1070" y1="105" x2="1070" y2="600"/>
    <line x1="1120" y1="110" x2="1120" y2="600"/>
    <line x1="640" y1="200" x2="1180" y2="200"/><line x1="640" y1="270" x2="1180" y2="270"/>
    <line x1="640" y1="340" x2="1180" y2="340"/><line x1="640" y1="410" x2="1180" y2="410"/>
    <line x1="640" y1="480" x2="1180" y2="480"/><line x1="640" y1="550" x2="1180" y2="550"/>
  </g>
  <!-- low blocks left -->
  <rect x="0" y="430" width="180" height="170" fill="#0a1734" opacity="0.85"/>
  <rect x="200" y="470" width="140" height="130" fill="#0d1c3e" opacity="0.85"/>
  <rect x="360" y="400" width="200" height="200" fill="#0b1838" opacity="0.85"/>
  <!-- drifting clouds -->
  <g fill="#9db8ee" opacity="0.10">
    <ellipse cx="180" cy="120" rx="170" ry="26"/>
    <ellipse cx="420" cy="80" rx="120" ry="18"/>
    <ellipse cx="900" cy="180" rx="200" ry="22"/>
  </g>
</svg>
