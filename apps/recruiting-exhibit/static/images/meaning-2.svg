  </g>
  <!-- sticky notes -->
  <g>
    <rect x="380" y="60" width="44" height="44" rx="3" fill="#f2c14e" opacity="0.85"/>
    <rect x="440" y="70" width="44" height="44" rx="3" fill="#e88f5b" opacity="0.8"/>
