<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9fb3c8"/>
      <stop offset="1" stop-color="#5d7390"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bg4)"/>
  <!-- desk -->
  <rect x="0" y="300" width="600" height="100" fill="#4a5a6e"/>
  <!-- laptop -->
  <rect x="170" y="180" width="260" height="150" rx="10" fill="#22304a"/>
  <rect x="182" y="192" width="236" height="126" rx="4" fill="#8fb2dc"/>
  <rect x="150" y="328" width="300" height="12" rx="6" fill="#2f3f57"/>
  <!-- screen lines -->
  <g stroke="#dce9fa" stroke-opacity="0.75" stroke-width="7" stroke-linecap="round">
    <line x1="200" y1="222" x2="400" y2="222"/>
    <line x1="200" y1="248" x2="360" y2="248"/>
    <line x1="200" y1="274" x2="380" y2="274"/>
  </g>
  <!-- coffee -->
  <rect x="470" y="250" width="46" height="56" rx="8" fill="#e9eef5"/>
  <ellipse cx="493" cy="252" rx="23" ry="7" fill="#7a5230"/>
  <!-- plant -->
  <rect x="90" y="250" width="40" height="52" rx="6" fill="#c98f5b"/>
  <g stroke="#3f7a52" stroke-width="7" stroke-linecap="round">
    <line x1="110" y1="252" x2="96" y2="214"/><line x1="110" y1="252" x2="124" y2="210"/>
    <line x1="110" y1="252" x2="110" y2="204"/>
  </g>
</svg>
